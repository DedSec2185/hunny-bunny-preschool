                        <span style={{ fontSize:9, fontWeight:800, letterSpacing:1.5, color:p.color, background:"#fff", border:`1px solid ${p.color}`, borderRadius:100, padding:"3px 10px" }}>{p.tag}</span>
                      </div>
                      <p style={{ fontSize:13, color:S.gray, margin:0, maxWidth:600, lineHeight:1.6 }}>{p.why}</p>
                    </div>
                  </div>
                </div>
                <div style={{ padding:"8px 0" }}>
                  {p.steps.map((s,i) => (
                    <div key={i} style={{ borderBottom:`1px solid ${S.border}` }}>
                      <button onClick={() => setOpenStep(prev => ({...prev, [`${p.id}_${i}`]: !prev[`${p.id}_${i}`]}))} style={{
                        width:"100%", background:"none", border:"none", padding:"16px 24px",
                        cursor:"pointer", display:"flex", justifyContent:"space-between", alignItems:"center", textAlign:"left", gap:12,
                      }}>
                        <div style={{ display:"flex", alignItems:"center", gap:12 }}>
                          <div style={{ width:28, height:28, borderRadius:8, background:p.tagBg, border:`1.5px solid ${p.color}`, display:"flex", alignItems:"center", justifyContent:"center", fontSize:12, fontWeight:900, color:p.color, flexShrink:0 }}>{i+1}</div>
                          <span style={{ fontSize:14, fontWeight:700, color:S.navy }}>{s.step}</span>
                        </div>
                        <span style={{ color:p.color, fontSize:18, transition:"transform .2s", transform:openStep[`${p.id}_${i}`] ? "rotate(45deg)":"none", flexShrink:0 }}>+</span>
                      </button>
                      {openStep[`${p.id}_${i}`] && (
                        <div style={{ padding:"0 24px 20px 64px" }}>
                          <div style={{ background:S.bg, borderRadius:10, padding:"14px 16px" }}>
                            <p style={{ fontSize:13, color:S.navy, lineHeight:1.75, margin:0, whiteSpace:"pre-line" }}>{s.detail}</p>
                          </div>
                        </div>
                      )}
                    </div>
                  ))}
                </div>
                <div style={{ background:p.tagBg, padding:"16px 24px", display:"flex", gap:10, alignItems:"flex-start" }}>
                  <span style={{ fontSize:18 }}>📈</span>
                  <div style={{ fontSize:13, color:p.color === S.pink ? "#7a003a" : p.color, fontWeight:700, lineHeight:1.6 }}><strong>Expected Result: </strong>{p.results}</div>
                </div>
              </div>
            )}
          </div>
        )}

        {/* ── CONTENT IDEAS TAB ── */}
        {tab==="content" && (() => {
          const contentP = platforms.find(pl => pl.id === "content");
          return (
            <div>
              <div style={{ background:S.white, border:`1px solid ${S.border}`, borderRadius:16, overflow:"hidden" }}>
                <div style={{ background:"#F3E8FF", borderBottom:"2px solid #6B21A8", padding:"22px 28px" }}>
                  <h2 style={{ fontWeight:900, fontSize:18, color:S.navy, margin:"0 0 8px" }}>🎬 Content Ideas — 60+ Posts, Never Run Out</h2>
                  <p style={{ fontSize:13, color:S.gray, margin:0 }}>Organised by category. Mix these throughout your posting calendar. Real, specific, actionable.</p>
                </div>
                {contentP.steps.map((s,i) => (
                  <div key={i} style={{ borderBottom:`1px solid ${S.border}` }}>
                    <button onClick={() => setOpenStep(prev => ({...prev, [`content_${i}`]: !prev[`content_${i}`]}))} style={{
                      width:"100%", background:"none", border:"none", padding:"16px 24px",
                      cursor:"pointer", display:"flex", justifyContent:"space-between", alignItems:"center", textAlign:"left", gap:12,
                    }}>
                      <div style={{ display:"flex", alignItems:"center", gap:12 }}>
                        <div style={{ width:28, height:28, borderRadius:8, background:"#F3E8FF", border:"1.5px solid #6B21A8", display:"flex", alignItems:"center", justifyContent:"center", fontSize:12, fontWeight:900, color:"#6B21A8", flexShrink:0 }}>{i+1}</div>
                        <span style={{ fontSize:14, fontWeight:700, color:S.navy }}>{s.step}</span>
                      </div>
                      <span style={{ color:"#6B21A8", fontSize:18, transition:"transform .2s", transform:openStep[`content_${i}`] ? "rotate(45deg)":"none", flexShrink:0 }}>+</span>
                    </button>
                    {openStep[`content_${i}`] && (
                      <div style={{ padding:"0 24px 20px 64px" }}>
                        <div style={{ background:"#F9F5FF", borderRadius:10, padding:"14px 16px" }}>
                          <p style={{ fontSize:13, color:S.navy, lineHeight:1.85, margin:0, whiteSpace:"pre-line" }}>{s.detail}</p>
                        </div>
                      </div>
                    )}
                  </div>
                ))}
              </div>
              <div style={{ marginTop:20, background:S.white, border:`1px solid ${S.border}`, borderRadius:14, padding:"20px 24px" }}>
                <div style={{ fontWeight:800, fontSize:14, marginBottom:8 }}>✅ The 3-Photo Types That Get The Most Engagement for a Preschool</div>
                <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(200px,1fr))", gap:12 }}>
                  {[
                    { emoji:"🧒", title:"Children's hands (not faces)", desc:"Artwork, crafts, play — you don't need faces with parental consent issues. Hands + art = emotional, shareable." },
                    { emoji:"🎊", title:"Festival & dress-up moments", desc:"Janmashtami, Republic Day, Christmas, Sports Day — these get saved and shared by parents to family WhatsApp groups." },
                    { emoji:"🧼", title:"Behind-the-scenes: cleaning & safety", desc:"Parents LOVE seeing the classroom being cleaned, hand-washing routines, safety gear. Builds trust faster than anything." },
                  ].map(c => (
                    <div key={c.title} style={{ background:S.bg, borderRadius:10, padding:"16px" }}>
                      <div style={{ fontSize:24, marginBottom:8 }}>{c.emoji}</div>
                      <div style={{ fontWeight:800, fontSize:13, marginBottom:4 }}>{c.title}</div>
                      <p style={{ fontSize:12, color:S.gray, margin:0, lineHeight:1.6 }}>{c.desc}</p>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          );
        })()}

        {/* ── 90-DAY PLAN TAB ── */}
        {tab==="plan" && (
          <div>
            <p style={{ color:S.gray, fontSize:13, marginBottom:24, lineHeight:1.6 }}>This is the execution sequence. Do things in this order. Don't skip ahead to paid ads before the free foundation is solid — it wastes money.</p>
            <div style={{ display:"flex", flexDirection:"column", gap:16 }}>
              {adPlan.map((phase, i) => (
                <div key={i} style={{ background:S.white, border:`2px solid ${phase.color}20`, borderRadius:16, overflow:"hidden" }}>
                  <div style={{ background:`${phase.color}10`, borderBottom:`2px solid ${phase.color}30`, padding:"18px 24px", display:"flex", justifyContent:"space-between", alignItems:"center", flexWrap:"wrap", gap:10 }}>
                    <div>
                      <div style={{ fontWeight:900, fontSize:15, color:S.navy }}>{phase.phase}</div>
                      <div style={{ fontSize:11, fontWeight:700, color:phase.color, letterSpacing:1, marginTop:2 }}>{phase.label}</div>
                    </div>
                    <div style={{ background:"#fff", border:`1.5px solid ${phase.color}`, borderRadius:100, padding:"6px 18px", fontWeight:800, fontSize:13, color:phase.color }}>
                      💰 {phase.budget}
                    </div>
                  </div>
                  <div style={{ padding:"16px 24px" }}>
                    {phase.actions.map((a, j) => (
                      <div key={j} style={{ display:"flex", gap:10, padding:"8px 0", borderBottom: j < phase.actions.length-1 ? `1px solid ${S.border}` : "none" }}>
                        <div style={{ width:20, height:20, borderRadius:5, background:`${phase.color}15`, border:`1.5px solid ${phase.color}40`, display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0, marginTop:2 }}>
                          <span style={{ color:phase.color, fontSize:10, fontWeight:900 }}>✓</span>
                        </div>
                        <span style={{ fontSize:13, color:S.navy, lineHeight:1.6 }}>{a}</span>
                      </div>
                    ))}
                  </div>
                </div>
              ))}
            </div>
            <div style={{ marginTop:24, background:"#FFF8E8", border:"1px solid #F0DDA0", borderRadius:14, padding:"20px 24px" }}>
              <div style={{ fontWeight:800, fontSize:14, color:"#7a5c00", marginBottom:8 }}>📊 ROI Reality Check</div>
              <p style={{ fontSize:13, color:"#5a4400", lineHeight:1.7, margin:0 }}>
                Annual fee per child: <strong>₹47,000</strong>. If the 90-day plan brings just <strong>3 new admissions</strong>, that's <strong>₹1,41,000 in new annual revenue</strong> against a marketing investment of ₹0–₹8,000. That's a 17× return. Even if only 1 child joins from all digital efforts, every subsequent year they stay = recurring ₹47,000 revenue from that single admission.
              </p>
            </div>
          </div>
        )}

        {/* ── WEEKLY CALENDAR TAB ── */}
        {tab==="calendar" && (
          <div>
            <p style={{ color:S.gray, fontSize:13, marginBottom:24, lineHeight:1.6 }}>This is your repeatable weekly rhythm. Do this every week and you'll have 208 posts in a year with zero blank-page panic. Takes 45 minutes per week total once you have the Canva templates set up.</p>
            <div style={{ display:"flex", flexDirection:"column", gap:10 }}>
              {contentCalendar.map((day, i) => (
                <div key={i} style={{ display:"grid", gridTemplateColumns:"70px 170px 1fr", gap:14, background:S.white, border:`1px solid ${S.border}`, borderRadius:14, padding:"18px 22px", alignItems:"flex-start" }}>
                  <div style={{ background:`${day.color}15`, border:`1.5px solid ${day.color}`, borderRadius:8, padding:"8px 0", textAlign:"center" }}>
                    <div style={{ fontWeight:900, fontSize:13, color:day.color }}>{day.day}</div>
                  </div>
                  <div>
                    <div style={{ fontWeight:800, fontSize:12, color:day.color, marginBottom:3 }}>{day.platform}</div>
                    <div style={{ fontSize:11, fontWeight:700, color:S.gray2, background:`${day.color}08`, borderRadius:100, padding:"2px 8px", display:"inline-block" }}>{day.type}</div>
                  </div>
                  <p style={{ fontSize:13, color:S.navy, margin:0, lineHeight:1.65, fontStyle:"italic" }}>{day.example}</p>
                </div>
              ))}
            </div>
            <div style={{ marginTop:20, background:"#E6F4FF", border:"1px solid #B0D4F0", borderRadius:14, padding:"16px 22px" }}>
              <div style={{ fontWeight:800, fontSize:13, color:S.blue, marginBottom:6 }}>💡 Use Meta Business Suite to Schedule a Whole Week in 30 Minutes</div>
              <p style={{ fontSize:13, color:S.navy, margin:0, lineHeight:1.65 }}>Every Sunday, spend 30 minutes in Meta Business Suite: prepare 3 posts (photos + captions + hashtags), schedule them for Monday/Wednesday/Friday. Done. The rest of the week is just WhatsApp Status (takes 2 minutes) and responding to comments.</p>
            </div>
          </div>
        )}

        {/* ── TOOLS TAB ── */}
        {tab==="tools" && (
          <div>
            <p style={{ color:S.gray, fontSize:13, marginBottom:24 }}>Every tool listed here is 100% free for a school at this scale. No paid subscriptions needed for at least the first 6 months.</p>
            <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(280px,1fr))", gap:14 }}>
              {tools.map((t, i) => (
                <div key={i} style={{ background:S.white, border:`1px solid ${S.border}`, borderRadius:14, padding:"22px 20px" }}>
                  <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:12 }}>
                    <span style={{ fontSize:26 }}>{t.icon}</span>
                    <div>
                      <div style={{ fontWeight:900, fontSize:15, color:S.navy }}>{t.name}</div>
                      {t.free && <span style={{ fontSize:9, fontWeight:800, letterSpacing:1, color:S.green, background:"#E8F5EE", border:"1px solid #B7DEC8", borderRadius:100, padding:"2px 8px" }}>FREE</span>}
                    </div>
                  </div>
                  <p style={{ fontSize:13, color:S.gray, lineHeight:1.65, margin:"0 0 12px" }}>{t.use}</p>
                  <div style={{ fontSize:11, fontWeight:700, color:S.blue }}>{t.link}</div>
                </div>
              ))}
            </div>
            <div style={{ marginTop:20, background:S.white, border:`1px solid ${S.border}`, borderRadius:14, padding:"20px 24px" }}>
              <div style={{ fontWeight:800, fontSize:14, marginBottom:12 }}>📱 The Exact Phone Setup for Hunny Bunny (All Free)</div>
              <div style={{ display:"flex", flexDirection:"column", gap:10 }}>
                {[
                  "Download: WhatsApp Business, Meta Business Suite, Instagram, Canva, CapCut — 5 apps, all free",
                  "Create one Gmail: hunny.bunny.seawoods@gmail.com — use this for all platform sign-ups",
                  "Set up Google Business with this Gmail — it also gives you Google Photos storage for school photos",
                  "Connect Instagram to Facebook in Meta Business Suite — post to both in one tap",
                  "In Canva, create a 'Brand Kit': upload school logo, set colors to Orange #FF6200 + Yellow #FFD740 — every design stays on-brand automatically",
                ].map((item, i) => (
                  <div key={i} style={{ display:"flex", gap:12, fontSize:13, color:S.navy, padding:"8px 0", borderBottom: i < 4 ? `1px solid ${S.border}` : "none" }}>
                    <span style={{ color:S.orange, fontWeight:900, flexShrink:0 }}>→</span>
                    <span style={{ lineHeight:1.6 }}>{item}</span>
                  </div>
                ))}
              </div>
            </div>
          </div>
        )}

      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<DigitalPresencePlaybook />);
</script>
</body>
</html>
